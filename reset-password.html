<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重设密码 | 90 PROJECT</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root {
      color-scheme: dark;
      --gold: #f2c46f;
      --cream: #fff4d8;
      --ink: #080604;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .78), rgba(0, 0, 0, .92)),
        url("assets/images/hero-90-project.jpg") center / cover no-repeat;
      color: var(--cream);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(520px, 100%);
      padding: 30px;
      border: 1px solid rgba(242, 196, 111, .36);
      border-radius: 18px;
      background: rgba(10, 7, 4, .86);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .48);
    }

    h1 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 28px;
      line-height: 1.16;
    }

    p {
      margin: 0;
      color: rgba(255, 244, 216, .82);
      font-size: 16px;
      line-height: 1.65;
    }
  </style>
  <script>
    (function () {
      var isLocal = /^(localhost|127\.0\.0\.1)$/i.test(window.location.hostname);
      var target = new URL(isLocal ? '/member.html' : '/member', window.location.origin);
      var searchParams = new URLSearchParams(String(window.location.search || '').replace(/^\?/, ''));
      target.searchParams.set('reset', 'password');
      searchParams.forEach(function (value, key) {
        if (key !== 'refresh') target.searchParams.set(key, value);
      });
      window.location.replace(target.pathname + target.search + (window.location.hash || ''));
    }());
  </script>
</head>
<body>
  <main>
    <h1>正在进入重设密码</h1>
    <p>系统正在把你带到 90 PROJECT 会员中心。若没有自动跳转，请返回网站重新发送重设密码邮件。</p>
  </main>
</body>
</html>
